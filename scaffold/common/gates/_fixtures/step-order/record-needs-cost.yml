# clean.yml with ONE line changed: the spend record is conditioned on the cost being known.
# A run cancelled mid-agent produces no execution file and so no cost — it records NOTHING,
# `attempts` never rises, and the chain re-dispatches the same session forever.
jobs:
  run:
    steps:
      - name: Resolve the toolchain and install the gate's tooling
        uses: ./.github/actions/toolchain
      - name: Run the session headless
        uses: anthropics/claude-code-action@v1
      - name: Re-establish the toolchain and the gate's tooling under the session's own tree
        uses: ./.github/actions/toolchain
      - name: Run the session's gate (scripts/check.sh)
        run: ./scripts/check.sh
      - name: Restore the push credential the agent's action revoked
        if: always()
        run: git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${{ secrets.FACTORY_WRITE_TOKEN }}"
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.FACTORY_WRITE_TOKEN }}
        run: gh pr create --fill
      - name: Write status and evidence into the plan
        if: always()
        run: git push origin HEAD
      - name: Record what this run spent
        if: always() && steps.usage.outputs.cost != ''
        run: ./scripts/driver/spend.sh --append --cost "$cost"
      - name: Bundle the session's work if the run failed
        if: failure() || cancelled()
        run: git bundle create work.bundle --all
