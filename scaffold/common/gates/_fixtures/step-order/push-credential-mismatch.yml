# clean.yml with ONE line changed: the push credential is restored from GITHUB_TOKEN while
# the pull request is opened with FACTORY_WRITE_TOKEN. This is the shape the driver actually
# had on 2026-09-20, and the shape the first service's S3 and S4 were merged under.
#
# The plan-status commit pushed with GITHUB_TOKEN is attributed to `github-actions[bot]`, and
# a pull_request run triggered by that identity is left `action_required` rather than run. So
# the PR head — the commit a merge takes — carries no CI verdict, while the commit BELOW it is
# green and is what everyone quotes.
jobs:
  run:
    steps:
      - name: Resolve the toolchain and install the gate's tooling
        uses: ./.github/actions/toolchain
      - name: Run the session headless
        uses: anthropics/claude-code-action@v1
      - name: Re-establish the toolchain and the gate's tooling under the session's own tree
        uses: ./.github/actions/toolchain
      - name: Run the session's gate (scripts/check.sh)
        run: ./scripts/check.sh
      - name: Restore the push credential the agent's action revoked
        if: always()
        run: git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${{ secrets.GITHUB_TOKEN }}"
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.FACTORY_WRITE_TOKEN }}
        run: gh pr create --fill
      - name: Write status and evidence into the plan
        if: always()
        run: git push origin HEAD
      - name: Bundle the session's work if the run failed
        if: failure() || cancelled()
        run: git bundle create work.bundle --all
