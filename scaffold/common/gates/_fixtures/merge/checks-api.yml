# merge/clean.yml broken in one place: CI is read through the Checks API, which a fine-grained
# FACTORY_WRITE_TOKEN cannot reach, so every session stops on a 403.
name: Merge
on:
  workflow_run:
    workflows: ["Driver"]
    types: [completed]
concurrency:
  group: merge-${{ github.repository }}
  cancel-in-progress: false
jobs:
  land:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Judge the head, then merge
        env:
          GH_TOKEN: ${{ secrets.FACTORY_WRITE_TOKEN }}
        run: |
          for _ in $(seq 1 30); do
            ci="$(gh api "repos/r/commits/$sha/check-runs" --jq '.x')"
            [ -n "$ci" ] && break
            sleep 30
          done
          reader="$(gh api "repos/r/commits/$sha/statuses" --jq '.x')"
          decision="$(./scripts/driver/merge-decision.sh --ci "$ci" --reader "$reader")"
          [ "$decision" = merge ] && gh pr merge "$PR" --merge --match-head-commit "$sha"
