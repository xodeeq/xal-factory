name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# A newer push to the same PR supersedes the run on the older head, so cancel it; the new head
# gets its own full run, and that is the conclusion every merge condition reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    # SESSION PULL REQUESTS ARE READ BY THE READER INSTEAD (reader.yml, pipeline S7). ADR-0009
    # decision 10 named this bot as the reviewer an auto-merge must not race; on `plan/…` heads
    # its successor is the two-axis reader, whose verdict merge.yml waits for and whose
    # Standards axis covers what this bot covered. Running both would pay twice for one
    # reading. Every other pull request — amendments, fixes, docs — keeps this bot.
    if: ${{ !startsWith(github.head_ref, 'plan/') }}

    runs-on: ${{ vars.XAL_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

