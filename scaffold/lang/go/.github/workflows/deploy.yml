name: Deploy

# Continuous DEPLOYMENT — kept deliberately SEPARATE from ci.yml so that pull-request runs
# never touch production. The same Definition-of-Done gate (scripts/check.sh) must pass,
# THEN the release step runs migrations, THEN the app deploys, THEN a smoke test proves the
# live deployment works. A failed smoke fails the workflow loudly.
#
# ─────────────────────────────────────────────────────────────────────────────────────────
# SEEDED DISPATCH-ONLY. READ THIS BEFORE ADDING THE PUSH TRIGGER.
#
# The deployment conventions say CD is "from `main` only, after the gates" — this workflow's
# shape is that convention, and it ships at seeding so the shape is not reinvented later
# from memory. What it does NOT ship with is the `push: branches: [main]` trigger, because a
# freshly seeded service has no deploy target: no app, no database, no secrets. A push
# trigger here would turn every merge to main red from commit one, and a signal that is
# always red is a signal everyone learns to ignore — which costs more than having no signal
# at all.
#
# Un-comment the push trigger when the deploy target is provisioned — the database, the
# production secrets, the host account. Those are a person's actions, not an agent's:
# spending and granting access are irreversible.
# ─────────────────────────────────────────────────────────────────────────────────────────

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

# Never run two production deploys at once, and never cancel one mid-rollout.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Gate (scripts/check.sh)
    runs-on: ${{ vars.XAL_RUNNER || 'ubuntu-latest' }}
    env:
      CI: "true" # makes the lint, audit, Docker and drift gates mandatory (never skipped)
    steps:
      - uses: actions/checkout@v4

      # THIS MUST MIRROR ci.yml. Any workflow that runs check.sh has to supply every input
      # the script's gates need, and CI=true above makes them all mandatory rather than
      # skippable. Omitting one here is not a soft failure: the gate refuses to run, this job
      # fails, and `needs: gate` blocks the deploy — while CI on the same commit stays green,
      # so the PR looks entirely healthy. That is exactly the outage that .xal/gate-inputs
      # and check.sh's gate 0 exist to make fail before push instead.
      - name: Check out the process spec
        uses: actions/checkout@v4
        with:
          repository: xodeeq/xal-factory
          path: .xal-process

      # The same action ci.yml and driver.yml use: one file holds the toolchain resolution
      # and every pin, so mirroring ci.yml here is one line rather than three to keep in step.
      - name: Resolve the toolchain and install the gate's tooling
        uses: ./.github/actions/toolchain

      - name: Run gates (scripts/check.sh)
        env:
          XAL_PROCESS_DIR: .xal-process
        run: ./scripts/check.sh

  deploy:
    name: Migrate, deploy, smoke
    needs: gate
    runs-on: ${{ vars.XAL_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # deploy.target and deploy.url from .xal/factory.conf (scripts/driver/config.sh).
      - name: Read the factory configuration
        run: ./scripts/driver/config.sh --emit | tee -a "$GITHUB_ENV"

      - name: Unknown deploy target
        if: env.FACTORY_DEPLOY_TARGET != 'none' && env.FACTORY_DEPLOY_TARGET != 'fly'
        run: |
          echo "::error::deploy.target '$FACTORY_DEPLOY_TARGET' has no adapter in this workflow (none, fly)."
          exit 1

      # deploy.target = none: a single failing step, not a half-written pipeline. Steps
      # written against a host nobody has chosen would have never run, in a workflow nothing
      # triggers, and would read to anyone scanning the repo exactly like a working deploy
      # pipeline. A loud stop is the honest state.
      - name: No deploy target provisioned
        if: env.FACTORY_DEPLOY_TARGET == 'none'
        run: |
          echo "::error::deploy.target is none: this service has no deploy target, so there is nothing to deploy to."
          echo "The gate job above passed: the code is releasable; the destination does not exist."
          echo "Provision a target (a person's decision: it spends and grants access), then set"
          echo "deploy.target and deploy.url in .xal/factory.conf. See docs/deploy.md."
          exit 1

      # deploy.target = fly. The image's `migrate` subcommand runs as Fly's release_command
      # (fly.toml), so migrations are a release step from the same build, never run from app
      # startup. FLY_API_TOKEN is declared in .xal/gate-inputs with its expiry when this target
      # is chosen.
      - name: Set up flyctl
        if: env.FACTORY_DEPLOY_TARGET == 'fly'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy (release_command migrates first)
        if: env.FACTORY_DEPLOY_TARGET == 'fly'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      # The post-deploy gate: a deploy is done when the live URL proves it, not when the host
      # says it started. scripts/smoke.sh fails the workflow on any broken check.
      - name: Smoke the live deployment
        if: env.FACTORY_DEPLOY_TARGET != 'none'
        run: |
          [ "$FACTORY_DEPLOY_URL" != none ] || { echo "::error::deploy.url is none: there is no live URL to smoke"; exit 1; }
          ./scripts/smoke.sh "$FACTORY_DEPLOY_URL"
