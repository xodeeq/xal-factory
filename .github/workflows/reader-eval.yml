# reader-eval.yml: the reader's failing fixture, run by the real reader (ADR-0008).
#
# The two-axis reader ships with a committed failing fixture: a diff that omits a cited spec
# clause and must be reported. That fixture is gates/fixtures/reader/: `omission` (FX-FR-02
# cited, never realised, claimed done in a commit message) and `clean` (both clauses realised
# and asserted, RED before GREEN). This workflow runs the plugin's `reader` over each, exactly
# as a service's reader.yml would over a session PR, and scripts/reader-eval.sh judges the
# verdicts: the omission MUST be reported on the Spec axis by id, and the clean case MUST pass
# on both axes.
#
# WHEN IT RUNS, and why not on every build: each case is a frontier-model read that costs
# money, so it runs on a PR that changes the reader's definition, its fixture or its
# evaluator, and by hand on main before an xal-factory release is tagged. A service's
# reader.yml pins that tag, so no reader reaches a merge gate without this having been seen
# green on it. The evaluator's own fixtures run on every build, for free, in scripts/check.sh.
name: Reader eval

# NO `push` TRIGGER, AND THERE CANNOT BE ONE. claude-code-action rejects the event outright
# ("Unsupported event type: push"), measured on the first run after this workflow merged. It also runs
# only a workflow file identical to the default branch copy, so a PR that EDITS this file
# cannot run it either. What remains is what works: a PR changing the reader or its fixture
# (this file unchanged), and a manual dispatch on main — the step before cutting a tag.
on:
  pull_request:
    paths:
      - plugins/xal-factory/agents/reader.md
      - gates/fixtures/reader/**
      - scripts/reader-eval.sh
      - .github/workflows/reader-eval.yml
  workflow_dispatch:

concurrency:
  group: reader-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  eval:
    name: Reader eval — ${{ matrix.case }}
    runs-on: ${{ vars.XAL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: omission
            expect: findings:FX-FR-02
          - case: clean
            expect: pass
    env:
      FIX: gates/fixtures/reader
    steps:
      - uses: actions/checkout@v4

      # The same brief shape a service's reader.yml composes, pointed at the fixture instead of
      # a real pull request — so what is evaluated is the reader as it will actually be asked.
      - name: Compose the reader's brief
        id: brief
        run: |
          set -euo pipefail
          mkdir -p .reader
          awk 'NR==1 && $0=="---" {fm=1; next} fm && $0=="---" {fm=0; next} !fm' \
            plugins/xal-factory/agents/reader.md > "$RUNNER_TEMP/brief.md"
          {
            printf '\n\n## This reading\n\n'
            printf -- '- The pull request head is checked out at `%s/%s/head/` — read the code there.\n' "$FIX" "${{ matrix.case }}"
            printf -- '- Its standards are `%s/CLAUDE.md` (this is a fixture; ignore every other CLAUDE.md).\n' "$FIX"
            printf -- '- Session: S1. Its approved plan block, verbatim: `%s/session.md`.\n' "$FIX"
            printf -- '- The admitted spec it is built against: `%s/spec.md`.\n' "$FIX"
            printf -- '- The pull request diff against its merge base: `%s/%s/pr.diff`.\n' "$FIX" "${{ matrix.case }}"
            printf -- '- Its commits, oldest first: `%s/%s/commits.txt`.\n' "$FIX" "${{ matrix.case }}"
            printf -- '- Write the verdict to `.reader/verdict.json` and to nowhere else.\n'
          } >> "$RUNNER_TEMP/brief.md"
          {
            printf 'text<<XAL_READER_BRIEF_EOF\n'
            cat "$RUNNER_TEMP/brief.md"
            printf 'XAL_READER_BRIEF_EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Read
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.brief.outputs.text }}
          claude_args: >-
            --max-turns 40
            --model claude-opus-5-5
            --allowedTools "Read,Glob,Grep,Write"
            --disallowedTools "Edit,MultiEdit,WebFetch,WebSearch,Bash"

      - name: Judge the verdict
        run: |
          set -uo pipefail
          [ -f .reader/verdict.json ] && cat .reader/verdict.json
          ./scripts/reader-eval.sh --verdict .reader/verdict.json --expect "${{ matrix.expect }}"
